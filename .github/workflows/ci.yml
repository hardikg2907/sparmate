name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The runner builds with -stdlib=libc++ on Linux, and the sanitizer runtime ships apart from clang.
      - name: Install the C++ compiler and sandbox tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev bubblewrap
          sudo apt-get install -y "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"

      # Ubuntu 24.04 runners block unprivileged user namespaces, which bubblewrap needs.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Diagnose the sandboxed compile (temporary)
        if: always() && runner.os == 'macOS'
        run: |
          xcode-select -p
          ls -l /Library/Preferences/com.apple.dt.Xcode.plist || true
          log show --last 15m --style compact --predicate 'sender == "Sandbox"' 2>/dev/null | grep -E "deny\(1\) file-read" | sed -E 's/.*deny\(1\) //' | sort | uniq -c | sort -rn | head -60

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Check the commit messages in this pull request
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
