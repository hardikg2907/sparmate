services:
  sparmate:
    image: sparmate:latest
    build:
      context: ..
      dockerfile: container/Containerfile
    container_name: sparmate
    environment:
      - PORT=4747
      - SPARMATE_IN_CONTAINER=1
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      - "127.0.0.1:4747:4747"
    volumes:
      - "${STUDY_ROOT:-~/interview-prep}:/study"
      - "sparmate-data:/data"
      - "sparmate-kokoro:/kokoro"
      - "sparmate-claude:/home/node/.claude"
    restart: unless-stopped

volumes:
  sparmate-data:
  sparmate-kokoro:
  sparmate-claude:
